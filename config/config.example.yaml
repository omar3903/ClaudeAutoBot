# ===========================================================================
# AutoTradeBot configuration.  Copy to  config/config.yaml  and tune.
# Anything secret belongs in .env, not here. What you change on the dashboard
# (filters, strategies, scan settings, Autopilot) is remembered in
# data/runtime.json and wins over these defaults.
# ===========================================================================

app:
  log_level: "INFO"

account:
  # Day-trading guard rails. See tos_bot/risk/pdt_guard.py
  min_start_equity: 2000.0              # LIVE only: refuse to arm below this. Ignored in paper mode.
  paper_start_cash: 100000.0           # opening balance of the built-in simulator
  pdt_equity_threshold: 25000.0        # FINRA pattern-day-trader equity line
  max_day_trades_under_threshold: 3    # rolling 5 business days when equity < pdt_equity_threshold
  day_trade_warn_at: 2                 # surface a warning once this many are used
  cash_account: false                  # true => PDT rule N/A, but T+1 settlement guard applies

risk:
  max_risk_per_trade_pct: 1.0          # % of equity risked between entry and stop
  max_open_risk_pct: 4.0               # sum of open-trade risk not allowed to exceed this
  max_position_pct_of_equity: 12.0     # notional cap per trade
  max_symbol_pct_of_equity: 15.0       # cap per stock: shares already held + entries working + the new trade
  min_reward_risk: 1.5                 # discard plays whose target/stop R:R is below this
  round_lot: 1                         # share rounding

scanner:
  # Once a day before the open every US stock and ADR is ranked from its daily
  # candles. The hottest become the day's hot list; the next best in each sector
  # wait in a buffer. During the session the hot list and a few buffer names per
  # sector are rescanned on a cycle. The dashboard's Settings override the first
  # four values.
  premarket_time: "08:30"              # ET, 04:00-09:00 - the daily full scan
  cycle_minutes: 15                    # 5-60 - rescan the hot list and buffer names
  hot_list_size: 20                    # 5-50 - no more than a third from one sector
  sector_queue_size: 25                # 10-50 - buffer candidates lined up per sector
  buffer_picks_per_sector: 2           # new buffer names looked at per sector each cycle
  kept_per_sector: 2                   # promising buffer names kept waiting for a hot-list slot
  fast_cycle_seconds: 60               # hot list only, while Autopilot day-trades an open session
  fundamentals_leaders: 8              # valuation setups (SEC EDGAR financials) on this many top names
  max_universe: 0                      # 0 = every listing; a smaller number caps it (for testing)
  sectors: []                          # only scan + trade these, e.g. ["Technology", "Energy"]; [] = all.
                                       # The dashboard's Sectors button overrides this.
  prefilter:                           # liquid enough to trade, judged from the daily candles
    min_price: 3.0
    max_price: 600.0
    min_dollar_volume: 5_000_000       # 20-session average $ volume
    min_atr_pct: 1.0                   # daily ATR as % of price (need range to trade)

strategies:
  # Toggle individual setups and set per-strategy weight in the blended score.
  # Intraday setups are weighted by time of day (Aziz Ch. 7): momentum/breakout
  # fade at Mid-day, reversal setups hold up, trend setups improve into the Close.
  technical:
    # -- Aziz day-trade setups (How to Day Trade for a Living, Ch. 7) --
    abcd_pattern:           { enabled: true,  weight: 1.0, params: { window: 14, near_c_pct: 1.5, rvol_min: 1.3, max_retrace: 0.7, min_higher_low_atr: 0.5 } }
    bull_bear_flag:         { enabled: true,  weight: 0.9, params: { pole_atr_mult: 1.6, flag_bars: 3 } }
    red_to_green:           { enabled: true,  weight: 1.0, params: { max_dist_pct: 1.5, rvol_min: 1.3 } }
    intraday_reversal:      { enabled: true,  weight: 0.9, params: { min_run: 5, rsi_hot: 80, rsi_cold: 20 } }
    sr_bounce:              { enabled: true,  weight: 0.9, params: { touch_pct: 0.20, min_strength: 0.58, min_rvol: 1.3 } }
    opening_range_breakout: { enabled: true,  weight: 1.0, params: { or_minutes: 5, rvol_min: 1.3, max_or_vs_atr: 1.0 } }
    vwap_reclaim:           { enabled: true,  weight: 1.0, params: { min_bars_below: 3 } }
    ema_pullback_trend:     { enabled: true,  weight: 1.0, params: { fast: 9, slow: 20, trend: 50 } }
    gap_and_go:             { enabled: true,  weight: 1.0, params: { min_gap_pct: 2.0, rvol_min: 2.0 } }
    # -- swing setups (Murphy / Connors / Pignataro) --
    rsi2_mean_reversion:    { enabled: true,  weight: 0.8, params: { rsi_len: 2, buy_below: 10, sell_above: 90, trend_sma: 200 } }
    bollinger_fade:         { enabled: true,  weight: 0.7, params: { length: 20, mult: 2.0 } }
    atr_channel_breakout:   { enabled: true,  weight: 0.9, params: { length: 20, mult: 1.5 } }
    divergence_reversal:    { enabled: true,  weight: 0.8, params: { lookback: 40, stop_atr: 1.5 } }
    week52_breakout:        { enabled: true,  weight: 0.9, params: { proximity_pct: 1.0 } }
  fundamental:
    relative_value_comps:   { enabled: true,  weight: 1.2, params: { peer_count: 8, discount_trigger: 0.20, premium_trigger: 0.20 } }
    dcf_fair_value_gap:     { enabled: true,  weight: 1.2, params: { projection_years: 5, perpetuity_growth: 0.025, mos: 0.25 } }
    valuation_football_field: { enabled: true, weight: 1.0, params: {} }

valuation:
  # Inputs to the DCF / WACC engine (Pignataro Ch. 9). Financials come from the
  # companies' SEC filings; companies that don't file US-GAAP 10-Ks sit out.
  # Update rf from treasury.gov (use the 10-30y rate) and the MRP from
  # Damodaran's page (pages.stern.nyu.edu/~adamodar/) - both cited in the book.
  risk_free_rate: 0.042                 # 10-30Y US Treasury
  market_risk_premium: 0.055            # implied US equity risk premium (Damodaran)
  tax_rate: 0.21
  midyear_convention: true             # the book's Amazon example uses end-of-year; this is the banking default
  perpetuity_growth: 0.025
  projection_years: 5
  # UFCF is the NOPAT method (EBIT*(1-t) + D&A + def.tax + non-cash + dNWC - CapEx),
  # matching the book's Amazon model. When the exit-multiple and perpetuity terminal
  # values disagree by > 2.5x the DCF verdict is "ambiguous" and dcf_fair_value_gap
  # sits out (the book's growth-stock case).

execution:
  default_order_type: "LIMIT"          # LIMIT | MARKET | STOP_LIMIT  (regular hours)
  limit_offset_bps: 5                  # cross the spread by this when marketable-limit
  time_in_force: "DAY"
  bracket_orders: true                # attach stop + target as an OCO child (regular hours)

exit_manager:
  # Automatic exit strategy - runs every few seconds, no manual input.
  enabled: true
  breakeven_at_r: 1.3                 # tighten the stop once the trade is +this R (0 = off)
  breakeven_lock_r: 0.3               # ...to LOCK +this R of profit, not a pure scratch
  breakeven_buffer_bps: 5             # plus this nudge past the lock point
  trail_start_r: 2.0                  # begin trailing once past this R (0 = no trailing)
  trail_lock_ratio: 0.5               # keep the stop at this fraction of the open R
  flatten_intraday_before_close_min: 10   # force-close day trades this many min before the bell
  max_swing_hold_days: 10             # force-close swing trades held longer than this (0 = off)

autopilot:
  # Hands-off ENTRY. Exits are already automatic (exit_manager above); this
  # switch also lets the bot take the entry with no click. Off by default, and
  # tunable live from the dashboard.
  enabled: false                     # master switch
  allow_live: false                  # HARD gate - Autopilot NEVER routes a real order unless true
  trade_types: ["INTRADAY"]          # what it may auto-take: INTRADAY and/or SWING
  min_confidence: 0.62               # skip plays the strategy itself isn't confident in
  min_reward_risk: 2.0               # never auto-take a play worse than this (Aziz Rule 5)
  max_auto_positions: 2              # most concurrent open autopilot trades
  max_auto_trades_per_day: 3         # per session; matches the sub-$25k PDT day-trade cap
  max_open_risk_pct: 4.0             # open autopilot $-risk must stay under this % of equity
  max_per_strategy: 2                # at most this many concurrent auto trades from ONE strategy
  max_new_per_cycle: 1               # at most this many NEW auto entries per scan (no bursts)
  max_gross_exposure_pct: 100.0      # all positions together as % of equity - 100 = Autopilot never uses margin
  min_confirmations: 2               # a day-trade setup must show up in this many scans in a row
  skip_noise: [against_trend, wrong_side_of_vwap, against_gap, volume_against, conflict, low_expected_value]
                                     # noise flags Autopilot won't trade - see noise: below
  require_proven: true               # only trade strategies the replay (Strategies panel) has proven...
  min_replay_trades: 30              # ...over at least this many replayed trades
  min_replay_expectancy_r: 0.05      # ...averaging at least this much per trade, in R
  cooldown_after_loss: true          # skip a ticker for the rest of the session after it stops out
  require_catalyst: false            # true = only auto-take plays tagged gap / catalyst
  dry_run: false                     # true = log every entry it WOULD take but place nothing

noise:
  # Signs a play is more likely noise than an edge. Flagged plays stay visible (the
  # dashboard hides them unless you ask), Autopilot skips the flags in
  # autopilot.skip_noise, and the strategy replay shows what each check removes.
  gap_pct: 2.0                        # a gap this big from the prior close sets the day's direction
  volume_ratio: 1.5                   # opposing volume this many times the supporting volume
  volume_bars: 6                      # closed 5-minute bars the volume check looks back over
  min_expected_r: 0.15                # expected value (in R) below which a play isn't worth the risk

database:
  echo_sql: false
  pool_size: 5
  record_rejected_plays: true         # keep every suggestion, not just executed ones
