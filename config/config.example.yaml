# ===========================================================================
# AutoTradeBot configuration.  Copy to  config/config.yaml  and tune.
# Anything secret belongs in .env, not here. What you change on the dashboard
# (filters, strategies, scan settings, Autopilot) is remembered in
# data/runtime.json and wins over these defaults.
# ===========================================================================

app:
  log_level: "INFO"
  keep_awake: true                    # keep Windows from sleeping while the app runs - it has to be awake to run 24/7

account:
  # Day-trading guard rails. See autotradebot/risk/pdt_guard.py
  min_start_equity: 2000.0              # LIVE only: refuse to arm below this. Ignored in paper mode.
  day_trade_pct: 75                   # of the trading capital, day trades may hold this % at once and swing
                                      # trades the rest - the dashboard's Trading capital dialog changes it
  paper_start_cash: 100000.0           # opening balance of the built-in simulator
  pdt_equity_threshold: 25000.0        # FINRA pattern-day-trader equity line
  max_day_trades_under_threshold: 3    # rolling 5 business days when equity < pdt_equity_threshold
  day_trade_warn_at: 2                 # surface a warning once this many are used
  cash_account: false                  # true => PDT rule N/A, but T+1 settlement guard applies

risk:
  max_risk_per_trade_pct: 1.0          # % of equity risked between entry and stop
  max_open_risk_pct: 4.0               # sum of open-trade risk not allowed to exceed this
  max_position_pct_of_equity: 12.0     # notional cap per trade (the dashboard's "Max % per position" replaces it once moved)
  max_symbol_pct_of_equity: 15.0       # cap per stock: shares already held + entries working + the new trade
  max_adv_pct: 1.0                     # one order's shares, as % of the stock's median daily volume over its
                                       # last 20 completed sessions, so thin stocks fill; 0 = off
  min_reward_risk: 1.5                 # discard plays whose target/stop R:R is below this
  round_lot: 1                         # share rounding
  midday_size_pct: 60                  # a day trade sized at Mid-day (12-3 pm ET) risks this % of the usual
                                       # (Aziz: lower your size mid-day, the thin choppy hours); 100 = off

scanner:
  # Once a day before the open every US stock and ADR is ranked from its daily
  # candles. The hottest become the day's hot list; the next best in each sector
  # wait in a buffer. During the session the hot list and a few buffer names per
  # sector are rescanned on a cycle. The dashboard's Settings override the first
  # four values.
  premarket_time: "08:30"              # ET, 04:00-09:00 - the daily full scan
  cycle_minutes: 5                     # 3-5 - rescan the hot list and buffer names
  hot_list_size: 20                    # 5-50 - no more than a third from one sector
  sector_queue_size: 25                # 10-50 - buffer candidates lined up per sector
  wide_minutes: 30                     # the wide scan: every liquid stock's 5-minute candles this often in the
                                       # session (15-120; 0 = off) - one request per stock, a few minutes each
  wide_stocks: 0                       # the hottest N of the full scan's liquid stocks; 0 = all of them
  movers: 10                           # today's biggest movers on volume hold hot-list slots after each wide scan
  yesterday_movers: 10                 # ...and the last session's biggest movers, from the full scan (0 = off)
  live_scan: 10                        # watch-tier slots, right after the hot list, for the stocks topping IBKR's
                                       # live scans (% gainers, % losers, hot by volume; US stocks and ADRs at
                                       # $3-600), so one too quiet for the morning's ranking that explodes intraday
                                       # is streamed and checked (0-20; 0 = off)
  movers_min_rvol: 1.5                 # a mover counts only on at least this much relative volume
  buffer_picks_per_sector: 2           # new buffer names looked at per sector each cycle
  kept_per_sector: 2                   # promising buffer names kept waiting for a hot-list slot
  fast_cycle_seconds: 60               # hot list only, while Autopilot day-trades an open session
  plays_refresh_seconds: 15            # re-check the stocks with plays on the board this often (0 = off)
  close_check: true                    # at each 5-minute candle close in regular hours, +close_grace_s, check the
                                       # watch tier's setups on IBKR's just-closed bars at once, in place of the
                                       # fast cycle due then (false = off, the fast cycle as before)
  close_grace_s: 8                     # ...this many seconds after the close, once IBKR has printed most stocks'
                                       # new bars; those still without one are asked once more ~15 s later (0-30)
  mover_atr: 1.0                       # a watch stock whose streamed 1-minute candle spans this many 5-minute ATRs,
                                       # or makes a new high/low of the day on 3x its average minute volume, is
                                       # checked at once, at most once per 5 minutes (0-5; 0 = off)
  fundamentals_leaders: 8              # valuation setups (SEC EDGAR financials) on this many top names
  gapper_time: "09:15"                # ET, 08:00-09:25 - the pre-open gap check reads the hot list and buffer
                                       # names' pre-market candles once; the gappers join the hot list
  gapper_symbols: 400                  # at most this many names get a pre-market request
  gapper_min_gap_pct: 2.0              # a pre-market move this big, either way, counts as a gap...
  gapper_min_volume: 50000             # ...on at least this many pre-market shares (Aziz's gappers scan)
  max_universe: 0                      # 0 = every listing; a smaller number caps it (for testing)
  sectors: []                          # only scan + trade these, e.g. ["Technology", "Energy"]; [] = all.
                                       # The dashboard's Sectors button overrides this.
  prefilter:                           # liquid enough to trade, judged from the daily candles
    min_price: 3.0
    max_price: 600.0
    min_dollar_volume: 5_000_000       # 20-session average $ volume
    min_atr_pct: 1.0                   # daily ATR as % of price (need range to trade)

strategies:
  # Toggle individual setups and set per-strategy weight in the blended score.
  # Intraday setups are weighted by time of day (Aziz Ch. 7): momentum/breakout
  # fade at Mid-day, reversal setups hold up, trend setups improve into the Close.
  technical:
    # -- Aziz day-trade setups (How to Day Trade for a Living, Ch. 7) --
    abcd_pattern:           { enabled: true,  weight: 1.0, params: { window: 14, near_c_pct: 1.5, rvol_min: 1.3, max_retrace: 0.7, min_higher_low_atr: 0.5 } }
    bull_bear_flag:         { enabled: true,  weight: 0.9, params: { pole_atr_mult: 1.6, flag_bars: 3 } }
    red_to_green:           { enabled: true,  weight: 1.0, params: { max_dist_pct: 1.5, rvol_min: 1.3 } }
    intraday_reversal:      { enabled: true,  weight: 0.9, params: { min_run: 5, rsi_hot: 80, rsi_cold: 20 } }
    sr_bounce:              { enabled: true,  weight: 0.9, params: { touch_pct: 0.20, min_strength: 0.58, min_rvol: 1.3 } }
    opening_range_breakout: { enabled: true,  weight: 1.0, params: { or_minutes: 5, rvol_min: 1.3, max_or_vs_atr: 1.0 } }
    vwap_reclaim:           { enabled: true,  weight: 1.0, params: { min_bars_below: 3 } }
    ema_pullback_trend:     { enabled: true,  weight: 1.0, params: { fast: 9, slow: 20, trend: 50 } }
    gap_and_go:             { enabled: true,  weight: 1.0, params: { min_gap_pct: 2.0, rvol_min: 2.0 } }
    # -- swing setups (Murphy / Connors / Pignataro) --
    rsi2_mean_reversion:    { enabled: true,  weight: 0.8, params: { rsi_len: 2, buy_below: 10, sell_above: 90, trend_sma: 200 } }
    bollinger_fade:         { enabled: true,  weight: 0.7, params: { length: 20, mult: 2.0 } }
    atr_channel_breakout:   { enabled: true,  weight: 0.9, params: { length: 20, mult: 1.5 } }
    divergence_reversal:    { enabled: true,  weight: 0.8, params: { lookback: 40, stop_atr: 1.5 } }
    week52_breakout:        { enabled: true,  weight: 0.9, params: { proximity_pct: 1.0 } }
    # -- signal setups (autotradebot/signals): unusual insider buying from SEC Form 4 filings --
    insider_buying:         { enabled: true,  weight: 1.0, params: { min_score: 0.55, max_days_since: 10, stop_atr: 2.0, target_r: 3.0 } }
    # -- statistical setups (Chan, Algorithmic Trading ch. 4 and 7); on even when this file doesn't list them --
    gap_reversion:          { enabled: true,  weight: 1.0, params: { sigma_days: 90, ma_days: 20, max_minutes: 30, min_gap_sigmas: 1.0 } }
    earnings_drift:         { enabled: true,  weight: 1.0, params: { sigma_days: 90, min_gap_sigmas: 0.5, max_minutes: 30, target_r: 2.0 } }
  fundamental:
    relative_value_comps:   { enabled: true,  weight: 1.2, params: { peer_count: 8, discount_trigger: 0.20, premium_trigger: 0.20 } }
    dcf_fair_value_gap:     { enabled: true,  weight: 1.2, params: { projection_years: 5, perpetuity_growth: 0.025, mos: 0.25 } }
    valuation_football_field: { enabled: true, weight: 1.0, params: {} }

valuation:
  # Inputs to the DCF / WACC engine (Pignataro Ch. 9). Financials come from the
  # companies' SEC filings; companies that don't file US-GAAP 10-Ks sit out.
  # Update rf from treasury.gov (use the 10-30y rate) and the MRP from
  # Damodaran's page (pages.stern.nyu.edu/~adamodar/) - both cited in the book.
  risk_free_rate: 0.042                 # 10-30Y US Treasury
  market_risk_premium: 0.055            # implied US equity risk premium (Damodaran)
  tax_rate: 0.21
  midyear_convention: true             # the book's Amazon example uses end-of-year; this is the banking default
  perpetuity_growth: 0.025
  projection_years: 5
  # UFCF is the NOPAT method (EBIT*(1-t) + D&A + def.tax + non-cash + dNWC - CapEx),
  # matching the book's Amazon model. When the exit-multiple and perpetuity terminal
  # values disagree by > 2.5x the DCF verdict is "ambiguous" and dcf_fair_value_gap
  # sits out (the book's growth-stock case).

execution:
  default_order_type: "LIMIT"          # LIMIT | MARKET | STOP_LIMIT  (regular hours)
  limit_offset_bps: 5                  # cross the spread by this when marketable-limit
  time_in_force: "DAY"
  bracket_orders: true                # attach stop + target as an OCO child (regular hours)
  stream_lines: 80                    # real-time streams for the positions, then the best plays, then the watch
                                      # tier; ~20 of IBKR's ~100 market-data lines stay free for snapshots (0-90; 0 = off)
  stream_watch: 50                    # the watch tier: the day's hot list, kept and next buffer names, streamed
                                      # after the plays within stream_lines, checked at each candle close (0-80; 0 = off)

exit_manager:
  # Automatic exit strategy - runs every few seconds, no manual input.
  enabled: true
  breakeven_at_r: 1.3                 # tighten the stop once the trade is +this R (0 = off)
  breakeven_lock_r: 0.3               # ...to LOCK +this R of profit, not a pure scratch
  breakeven_buffer_bps: 5             # plus this nudge past the lock point
  trail_start_r: 2.0                  # begin trailing once past this R (0 = no trailing)
  trail_lock_ratio: 0.5               # keep the stop at this fraction of the open R
  flatten_intraday_before_close_min: 10   # force-close day trades this many min before the bell
  max_swing_hold_days: 10             # force-close swing trades held longer than this (0 = off)
  scale_out_pct: 50                   # at the first target of a play with two, take this % off - Aziz: sell half,
  scale_out_lock_r: 0.0               # ...move the stop to the entry (+ this R), let the rest run to the second (0 = off)

autopilot:
  # Hands-off ENTRY. Exits are already automatic (exit_manager above); this
  # switch also lets the bot take the entry with no click. Off by default, and
  # tunable live from the dashboard.
  enabled: false                     # master switch
  allow_live: false                  # HARD gate - Autopilot NEVER routes a real order unless true
  trade_types: ["INTRADAY"]          # what it may auto-take: INTRADAY, SWING and/or PAIRS
  strategies: []                      # only these setups, by key (e.g. ["abcd_pattern"]); empty = every setup
  min_confidence: 0.5                # day trades: only the weakest are kept out - the replay found higher stated
                                     # confidence went with worse trades, so it is no filter for quality
  min_swing_confidence: 0.5          # swing trades: their setups state flat 0.55-0.58 confidences and the
                                     # replay's proof is their real gate, so only the weakest are kept out
  min_reward_risk: 2.0               # never auto-take a play worse than this (Aziz Rule 5)
  max_auto_positions: 2              # most concurrent open autopilot trades
  max_auto_trades_per_day: 3         # per session; matches the sub-$25k PDT day-trade cap
  max_open_risk_pct: 4.0             # open autopilot $-risk must stay under this % of equity
  max_per_strategy: 2                # at most this many concurrent auto trades from ONE strategy
  max_new_per_cycle: 1               # at most this many NEW auto entries per scan (no bursts)
  max_gross_exposure_pct: 100.0      # all positions together as % of the trading capital (10-100); the header's
                                      # Trading capital says whether that includes margin (whole account) or not (cash only)
  min_confirmations: 2               # a day-trade setup must show up this many times in a row...
  confirm_on_new_candle: true        # ...each on a newer 5-minute candle, as the replay enters - not the same candle
                                     # read again by the next scan. Setups that fire on one candle (a reclaim, a flag)
                                     # are then never taken: min_confirmations 1, or this false, brings them back
  skip_noise: [against_gap]          # the only flag that removed worse trades on both halves of a year's replay;
                                     # the other flags stay visible on the board, and the replay adds the checks it proves
                                     # noise flags Autopilot won't trade - see noise: below. It also skips
                                     # not_trending / not_mean_reverting / turbulent_market once the replay
                                     # shows they remove losers, on every session and the held-out ones
  require_proven: true               # only trade strategies the replay (Strategies panel) has proven...
  min_replay_trades: 30              # ...over at least this many replayed trades
  min_replay_expectancy_r: 0.05      # ...averaging at least this much per trade, in R
  skip_replay_losers: day            # with require_proven off, still skip setups with evidence they lose: the replay
                                     # averages -replay_loser_r or worse overall and held out, or their own trades
                                     # -0.30R or worse over 10 (off / day / all)
  replay_loser_r: 0.05               # ...the loss per trade that counts as losing
  cooldown_after_loss: true          # skip a ticker for the rest of the session after it stops out
  max_daily_loss_pct: 2.0            # Aziz's daily maximum loss: once today's closed trades have lost this
                                     # % of equity, no more entries until the next session (0 = off)
  max_giveback_pct: 30.0             # ...or once the day's realized gain has given back this % of its best
                                     # (Aziz: never lose more than 30% of what the morning made; 0 = off)
  giveback_floor_pct: 0.25           # the give-back rule only counts a peak gain of at least this % of equity
  require_catalyst: false            # true = only auto-take plays tagged gap / catalyst
  dry_run: false                     # true = log every entry it WOULD take but place nothing

noise:
  # Signs a play is more likely noise than an edge. Flagged plays stay visible (the
  # dashboard hides them unless you ask), Autopilot skips the flags in
  # autopilot.skip_noise, and the strategy replay shows what each check removes.
  gap_pct: 2.0                        # a gap this big from the prior close sets the day's direction
  volume_ratio: 1.5                   # opposing volume this many times the supporting volume
  volume_bars: 6                      # closed 5-minute bars the volume check looks back over
  min_expected_r: 0.15                # expected value (in R) below which a play isn't worth the risk
  # From the books' statistics (Chan ch. 2 and 6; Hamilton ch. 22): the Hurst exponent of the candles a
  # setup trades on says whether the price has been trending or snapping back, and SPY's Markov switching
  # model whether the market is calm or turbulent.
  trending_hurst: 0.55                # from here up the price reads as trending (reversal setups get flagged)
  reverting_hurst: 0.45               # from here down as mean reverting (momentum setups get flagged)
  turbulent_probability: 0.7          # momentum setups are flagged from this probability of the turbulent regime
  # From the news and the earnings calendar (Tsay ch. 9's market model; Chan on moves with and without news):
  abnormal_z: 2.0                     # a move this many usual moves beyond what the market explains is the stock's own
  market_model_sessions: 60           # the sessions the market model is fitted on
  news_fresh_minutes: 60              # news read longer ago than this doesn't count as "no news"
  earnings_ahead_days: 5              # swing plays with an earnings report due this many sessions ahead are flagged

replay:
  # How the Strategies panel's replay tests the setups (Chan, Quantitative Trading ch. 3). 60 day-trade
  # sessions give most setups the 30+ trades a record needs, with 20 sessions - about a month - held out;
  # 250 swing sessions is a year, as far back as the stored daily candles go.
  sessions: 60                        # day-trade sessions of 5-minute candles (5-120)
  swing_sessions: 250                 # swing sessions of daily candles (20-250)
  swing_stocks: 400                   # swing setups replayed on this many of the full scan's leaders too, not
                                      # just the day's watchlist (0 = watchlist only); their candles are on disk
  slippage_bps: 5.0                   # on every market fill, each way
  commission_bps: 1.0                 # on every fill
  commission_per_share: 0.005         # IBKR's fixed commission on top, on every fill: this much a share...
  commission_min: 1.0                 # ...at least this much an order...
  commission_max_pct: 1.0             # ...and at most this % of the order's value (0 = no cap)
  nominal_risk_usd: 1000              # the replay counts in R and has no size: the commission is charged on the
                                      # shares a trade risking this much would buy (1% of a nominal $100k account);
                                      # only the minimum and the cap depend on it
  held_out_fraction: 0.3334           # the latest sessions kept out of sample; Autopilot wants profits there too
  workers: 0                          # processes replaying stocks side by side; 0 = every core but two
  sessions_per_job: 10                # a day-trade job replays this many sessions of one stock (spreads the work)

pairs:
  # Pairs trading (autotradebot/pairs): two stocks from one industry whose log prices are cointegrated
  # (Vidyamurthy, Pairs Trading; Chan, Algorithmic Trading ch. 2-4). The spread is bought or sold past
  # its band and both legs are closed together at the mean, the stop, the time stop - or at once when
  # the pair has lost emergency_loss_r times its planned risk. Live pairs need a $25k margin account.
  enabled: true
  max_pairs: 12                       # pairs on the watch list
  per_group: 2                        # at most this many from one industry
  min_correlation: 0.6                # daily returns, over the fitting window - only narrows the search
  min_price: 5.0
  min_dollar_volume: 10000000         # a day, on average over 20 sessions
  fit_days: 200                       # sessions the hedge ratio and the band are fitted on
  test_days: 100                      # the latest sessions each pair is tested on, fitted on the ones before
  require_stable: true                # only watch pairs that were already pairs on the sessions before
  half_life_days: [2, 30]
  min_crossings: 6                    # crossings of the spread's mean in the fitting window
  entry_z: [1.0, 2.5]                 # the band's bounds; Vidyamurthy's design picks it inside them
  exit_z: 0.0                         # exit back at the mean
  stop_beyond_entry: 2.0              # the stop, in standard deviations beyond the band
  time_stop_half_lives: 2.0
  cost_bps: 6.0                       # each leg, each fill - used for the band
  window_minutes: [30, 5]             # entries and exits are decided between these minutes before the close
  max_open_pairs: 3
  max_new_per_day: 2                  # for Autopilot, with PAIRS in autopilot.trade_types
  emergency_loss_r: 2.0
  etf_pairs: [[EWA, EWC], [GLD, GDX], [XLE, XOP], [KBE, KRE]]

journal:
  # The daily report (the Reports button): every trade with the readings it was taken on, the mistakes,
  # the plays that weren't taken and how they would have done, and what the strategies' records say.
  enabled: true
  review_at: "16:15"                  # ET, after the close
  # The market's biggest gainers and losers of the session (this many of each): why each one moved - news,
  # filings, analyst actions, its sector - and whether the bot traded it, offered it, watched it or missed it.
  # Their daily candles are the ones the next morning's scan downloads, fetched after the close instead.
  movers: 10

signals:
  # What a company's insiders buy and sell (SEC Form 4 filings) and what the news says
  # about it (IBKR news, SEC 8-K filings, and Finnhub with a free key in Connections).
  # Unusual insider buying creates swing buy plays; insider selling and the news only
  # nudge the scores of other plays. Headlines are scored by FinBERT on this computer.
  enabled: true
  insider_poll_minutes: 3             # how often SEC's live feed of Form 4 filings is read
  backfill_days: 5                    # trading days of Form 4 filings read on the first start
  insider_window_days: 30             # insider trades this close together count as one wave
  insider_history_days: 365           # how far back "its insiders rarely buy" looks
  buy_floor: 25000                    # a wave of buying below this many dollars is a token
  buy_full: 1000000
  sell_floor: 250000
  sell_full: 10000000
  unusual_buying: 0.55                # insider score (0-1) from which buying counts as unusual
  unusual_selling: 0.65
  news_poll_minutes: 15               # news for the hot list and open positions
  news_lookback_days: 3
  sentiment: true                     # score headlines with FinBERT when it is installed
  boost_insider_buying: 0.10          # added to a long play's score at an insider score of 1
  boost_insider_selling: 0.08         # taken off a long play's score at an insider score of 1
  boost_news: 0.06                    # at a news sentiment of +1 or -1
  calendar_hours: 6                   # Finnhub's earnings calendar (needs the key): how often it's read...
  calendar_days_ahead: 30             # ...and how far ahead

database:
  echo_sql: false
  pool_size: 5
  record_rejected_plays: true         # keep every suggestion, not just executed ones
