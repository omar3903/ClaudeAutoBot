[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autotradebot"
version = "0.1.0"
description = "AutoTradeBot - human-in-the-loop trading assistant for Interactive Brokers, with a built-in simulator"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Omar Abdeen", email = "omarabdeen123@gmail.com" },
  { name = "Claude (Anthropic)", email = "noreply@anthropic.com" },
]
dependencies = [
  "numpy>=1.24", "pandas>=2.0", "pydantic>=2.6", "pydantic-settings>=2.2",
  "PyYAML>=6.0", "python-dotenv>=1.0", "SQLAlchemy>=2.0", "PyMySQL>=1.1",
  "fastapi>=0.110", "uvicorn[standard]>=0.29", "websockets>=12.0",
  "ib_async>=1.0.3", "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
sentiment = ["transformers>=4.40", "torch>=2.2"]    # FinBERT headline sentiment for the signals
learning = ["scikit-learn>=1.5"]                    # the meta-label model (research/model.py)

[project.scripts]
autotradebot = "run:main"

[tool.setuptools]
packages = ["autotradebot"]
py-modules = ["run"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow'"
markers = ["slow: end-to-end tests that boot the engine (run with -m slow)"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
