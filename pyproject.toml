[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autotradebot"
version = "0.1.0"
description = "AutoTradeBot - human-in-the-loop trading assistant (IBKR, Schwab/thinkorswim, built-in simulator)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "omarabdeen123" }]
dependencies = [
  "numpy>=1.24", "pandas>=2.0", "pydantic>=2.6", "pydantic-settings>=2.2",
  "PyYAML>=6.0", "python-dotenv>=1.0", "python-dateutil>=2.9", "pytz>=2024.1",
  "tenacity>=8.2", "SQLAlchemy>=2.0", "PyMySQL>=1.1", "cryptography>=42.0",
  "fastapi>=0.110", "uvicorn[standard]>=0.29", "jinja2>=3.1", "websockets>=12.0",
  "yfinance>=0.2.40", "requests>=2.31", "ib_async>=1.0.3", "schwab-py>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
autotradebot = "run:main"

[tool.setuptools]
packages = ["tos_bot"]
py-modules = ["run"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow'"
markers = ["slow: end-to-end tests that boot the engine (run with -m slow)"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
